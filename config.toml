# Published at the apex of a custom domain, so there is no path prefix and
# the rendered files sit at the root of the deploy branch.
base_url = "https://blog.rozy.my.id"
title = "LitFill's"
description = "Technical notes on Koka, Nix, and the incidental failures encountered along the way."
default_language = "en"
generate_feeds = true

# Zola ships no Koka grammar, so the syntax and the themes that colour it live
# in the repository and are handed to giallo here. Giallo highlights code at
# build time and emits light-dark() colors, so the theme follows the reader's
# system setting with no javascript involved.
[markdown.highlighting]
light_theme = "koka-light"
dark_theme = "koka-dark"
extra_grammars = ["syntaxes/koka.sublime-syntax"]
extra_themes = ["syntaxes/koka-light.tmTheme", "syntaxes/koka-dark.tmTheme"]

