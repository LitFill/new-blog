# Published at the apex of a custom domain, so there is no path prefix and
# the rendered files sit at the root of the deploy branch.
base_url = "https://blog.rozy.my.id"
title = "LitFill's"
description = "Technical notes on Koka, Nix, and the incidental failures encountered along the way."
default_language = "en"
generate_feeds = true

# Giallo highlights code at build time and emits light-dark() colors, so the
# theme follows the reader's system setting with no javascript involved.
[markdown.highlighting]
light_theme = "github-light"
dark_theme = "github-dark"
